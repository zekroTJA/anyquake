name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner: the binary only needs the glibc it was
    # built against, so building on an older one keeps it installable on
    # older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Package
        run: |
          mkdir dist
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
