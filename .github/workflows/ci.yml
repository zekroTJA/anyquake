name: CI

on:
  # Every pushed commit on any branch. Tags are left to release.yml, which
  # runs the tests itself.
  push:
    branches: ["**"]
    paths:
      - src/
      - Cargo.lock
      - Cargo.toml
  # Pull requests from forks don't trigger `push` in this repository.
  pull_request:
    paths:
      - src/
      - Cargo.lock
      - Cargo.toml

jobs:
  test:
    strategy:
      # Report the results of every platform, not just the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked
