[package]
name = "anyquake"
version = "0.3.0"
edition = "2024"
description = "Toggle any application window on the current screen with a global hotkey"
authors = ["Ringo Hoffmann"]
license = "MIT"
repository = "https://github.com/zekroTJA/anyquake"
readme = "README.md"

[dependencies]
anyhow = "1"
auto-launch = "0.6"
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
env_logger = "0.11"
interprocess = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = [
    "async-io",
    "blocking",
] }
serde_json = "1"
x11rb = { version = "0.14", features = ["randr"] }
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.10"
tray-icon = "0.26"
winit = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
lto = true
strip = true

# Linux packages: `cargo deb` (cargo-deb) and `cargo generate-rpm`
# (cargo-generate-rpm), both after `cargo build --release`. The settings
# window loads its graphics and windowing libraries at runtime (dlopen), so
# the package tools can't detect them and they are listed explicitly.

[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto, libegl1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-cursor0, libwayland-egl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2"
extended-description = """\
Shows and hides any application window with a global hotkey, quake-console \
style, on the screen the mouse cursor is on. Supports KDE Plasma (Wayland \
and X11) and X11 window managers."""
assets = [
    [
        "target/release/anyquake",
        "usr/bin/",
        "755",
    ],
    [
        "packaging/anyquake.desktop",
        "usr/share/applications/",
        "644",
    ],
    [
        "packaging/anyquake.svg",
        "usr/share/icons/hicolor/scalable/apps/",
        "644",
    ],
    [
        "README.md",
        "usr/share/doc/anyquake/",
        "644",
    ],
    [
        "LICENSE",
        "usr/share/doc/anyquake/",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/anyquake", dest = "/usr/bin/anyquake", mode = "755" },
    { source = "packaging/anyquake.desktop", dest = "/usr/share/applications/anyquake.desktop", mode = "644" },
    { source = "packaging/anyquake.svg", dest = "/usr/share/icons/hicolor/scalable/apps/anyquake.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/anyquake/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/anyquake/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-cursor.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrandr.so.2()(64bit)" = "*"
