[package]
name = "anyquake"
version = "0.1.0"
edition = "2024"
description = "Toggle any application window on the current screen with a global hotkey"

[dependencies]
anyhow = "1"
auto-launch = "0.6"
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
env_logger = "0.11"
interprocess = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
serde_json = "1"
x11rb = { version = "0.14", features = ["randr"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.10"
tray-icon = "0.26"
winit = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
lto = true
strip = true
